  return PAGES[h]?h:"home";
}
function show(r,push){
  if(!PAGES[r])r="home";
  if(push)history.pushState({route:r},"","#"+r);
  loading.style.display="flex";
  iframe.srcdoc=decode(PAGES[r]);
  window.scrollTo(0,0);
}
iframe.addEventListener("load",()=>setTimeout(()=>loading.style.display="none",100));
window.addEventListener("message",e=>{
  if(e.data?.type==="arvexa-route")show(e.data.route,true);
  if(e.data?.type==="arvexa-height"){
    iframe.style.height=Math.max(Number(e.data.height)||0,window.innerHeight)+"px";
  }
});
window.addEventListener("popstate",()=>show(route(),false));
window.addEventListener("hashchange",()=>show(route(),false));
show(route(),false);
</script>
</body>
</html>
